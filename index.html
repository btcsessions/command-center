<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0a1410">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a1410;
  --surface: rgba(16, 32, 28, 0.75);
  --surface-hover: rgba(22, 46, 38, 0.85);
  --text: #e0f2ec;
  --text-muted: #6faa96;
  --border: rgba(40, 80, 68, 0.6);
  --radius: 12px;
  --fitness: #22c55e;
  --work: #00d4aa;
  --personal: #38bdf8;
  --education: #a78bfa;
  --danger: #f43f5e;
  --glow: rgba(0, 212, 170, 0.15);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(0, 180, 140, 0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(0, 120, 100, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(0, 80, 60, 0.05) 0%, transparent 50%);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-font-smoothing: antialiased;
}

header {
  text-align: center;
  padding: 24px 16px 8px;
  position: relative;
}
header h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: linear-gradient(135deg, #00d4aa 0%, #38bdf8 50%, #a78bfa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
header .date {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--text-muted);
  margin-top: 4px;
  letter-spacing: 0.06em;
}
.backup-bar {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
}
.backup-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 1.1rem;
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.backup-btn:hover { background: var(--surface-hover); color: var(--text); border-color: var(--work); }

#app {
  padding: 8px;
  max-width: 1200px;
  margin: 0 auto;
}

@media (min-width: 640px) {
  #app { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; align-items: start; }
}
@media (min-width: 1024px) {
  #app { grid-template-columns: repeat(4, 1fr); }
}

/* Category cards */
.category {
  background: var(--surface);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: var(--radius);
  margin-bottom: 8px;
  overflow: hidden;
  border-left: 4px solid var(--cat-color);
  box-shadow: 0 2px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.04);
}
@media (min-width: 640px) {
  .category { margin-bottom: 0; }
}
.category[data-category="fitness"]  { --cat-color: var(--fitness); }
.category[data-category="work"]     { --cat-color: var(--work); }
.category[data-category="personal"] { --cat-color: var(--personal); }
.category[data-category="education"]{ --cat-color: var(--education); }

.category-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: background 0.15s;
  min-height: 56px;
}
.category-header:hover { background: var(--surface-hover); }
.category-header:focus-visible { outline: 2px solid var(--cat-color); outline-offset: -2px; }

.category-icon { font-size: 1.3rem; flex-shrink: 0; }
.category-name {
  font-weight: 600;
  font-size: 0.95rem;
  white-space: nowrap;
}
.next-preview {
  flex: 1;
  min-width: 0;
  text-align: right;
  font-size: 0.85rem;
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* Inline actionable task in collapsed header */
.inline-task {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
  justify-content: flex-end;
}
.inline-task-check {
  appearance: none; -webkit-appearance: none;
  width: 18px; height: 18px; border: 2px solid var(--cat-color);
  border-radius: 50%; flex-shrink: 0; cursor: pointer; position: relative;
  transition: background 0.2s; background: transparent;
}
.inline-task-check:checked {
  background: var(--cat-color);
}
.inline-task-check:checked::after {
  content: "\2713"; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%); color: #fff; font-size: 10px; font-weight: bold;
}
.inline-task-title {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 0.85rem; color: var(--text);
}
.inline-project-label {
  color: var(--text-muted); font-size: 0.8rem; white-space: nowrap; flex-shrink: 0;
}
.expand-arrow {
  flex-shrink: 0;
  font-size: 0.7rem;
  color: var(--text-muted);
  transition: transform 0.25s ease;
}
.category.expanded .expand-arrow { transform: rotate(180deg); }

/* Category body */
.category-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.category.expanded .category-body {
  max-height: 2000px;
  transition: max-height 0.4s ease;
}

.task-list {
  list-style: none;
  padding: 0 8px;
}
.task-wrapper:not(:last-child) {
  border-bottom: 1px solid var(--border);
}

/* Task items */
.task-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 8px;
  border-radius: 8px;
  transition: background 0.15s, opacity 0.2s;
  position: relative;
  overflow: hidden;
}
.task-item.dragging {
  opacity: 0.3;
}
.task-item.drag-over-top {
  box-shadow: 0 -2px 0 0 var(--cat-color) inset;
}
.task-item.drag-over-bottom {
  box-shadow: 0 2px 0 0 var(--cat-color) inset;
}
/* Drop zone highlights for cross-container drops */
.category-header.drag-over-bottom {
  background: rgba(255,255,255,0.08);
  box-shadow: 0 2px 0 0 var(--cat-color) inset;
}
.subtask-list.drag-over-bottom,
.add-subtask-btn.drag-over-bottom {
  background: rgba(255,255,255,0.06);
  box-shadow: 0 0 0 1px var(--cat-color) inset;
  border-radius: 6px;
}
.task-item.first-task {
  background: rgba(255,255,255,0.03);
}

.drag-handle {
  cursor: grab;
  color: var(--text-muted);
  font-size: 1rem;
  padding: 4px;
  touch-action: none;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  min-width: 28px;
  min-height: 44px;
  justify-content: center;
}
.drag-handle:active { cursor: grabbing; }

.task-check {
  appearance: none;
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border: 2px solid var(--cat-color);
  border-radius: 50%;
  flex-shrink: 0;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
}
.task-check:checked {
  background: var(--cat-color);
}
.task-check:checked::after {
  content: "\2713";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  font-size: 12px;
  font-weight: bold;
}

.task-title {
  flex: 1;
  min-width: 60px;
  font-size: 0.9rem;
  word-break: break-word;
  overflow: hidden;
  text-overflow: ellipsis;
}

.recurrence-badge {
  font-size: 0.7rem;
  background: rgba(255,255,255,0.08);
  color: var(--text-muted);
  padding: 2px 7px;
  border-radius: 10px;
  white-space: nowrap;
  flex-shrink: 0;
}

.task-edit-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 6px;
  font-size: 1rem;
  border-radius: 6px;
  flex-shrink: 0;
  min-width: 36px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.task-edit-btn:hover { background: var(--surface-hover); color: var(--text); }

.add-task-btn {
  display: block;
  width: calc(100% - 16px);
  margin: 4px 8px 12px;
  padding: 10px;
  background: rgba(255,255,255,0.04);
  border: 2px dashed var(--border);
  border-radius: 8px;
  color: var(--text-muted);
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  min-height: 44px;
}
.add-task-btn:hover {
  background: rgba(255,255,255,0.08);
  border-color: var(--cat-color);
  color: var(--text);
}

.empty-msg {
  text-align: center;
  padding: 16px 8px;
  color: var(--text-muted);
  font-size: 0.85rem;
}

/* Modal overlay */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 1000;
  justify-content: center;
  align-items: flex-end;
  padding: 0;
}
@media (min-width: 640px) {
  .modal-overlay { align-items: center; padding: 16px; }
}
.modal-overlay.open {
  display: flex;
}

.modal-content {
  background: rgba(14, 28, 24, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 480px;
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 24px 20px;
  max-height: 90vh;
  max-height: 90dvh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
}
@media (min-width: 640px) {
  .modal-content { border-radius: var(--radius); }
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-title {
  font-size: 1.15rem;
  font-weight: 700;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-bottom: 6px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.form-input, .form-select {
  width: 100%;
  padding: 10px 12px;
  background: rgba(10, 20, 16, 0.8);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 1rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}
.form-input:focus, .form-select:focus {
  border-color: var(--work);
  box-shadow: 0 0 0 2px var(--glow);
}
.form-select { cursor: pointer; }
.form-select option { background: #0e1c18; }

.day-toggles {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.day-toggle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.day-toggle.active {
  background: var(--work);
  border-color: var(--work);
  color: #0a1410;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}
.btn {
  flex: 1;
  padding: 12px 16px;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  min-height: 44px;
  transition: opacity 0.15s;
}
.btn:active { opacity: 0.8; }
.btn-primary { background: var(--work); color: #0a1410; font-weight: 700; }
.btn-secondary { background: var(--surface-hover); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }

.hidden { display: none !important; }

/* Touch drag ghost */
.drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  background: rgba(14, 28, 24, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 8px;
  padding: 10px 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 12px var(--glow);
  font-size: 0.9rem;
  opacity: 0.95;
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  border-left: 4px solid var(--cat-color, var(--work));
}

/* Urgency dots */
.urgency-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.urgency-dot.low { background: #64748b; }
.urgency-dot.medium { background: #00d4aa; }
.urgency-dot.high { background: #f59e0b; }
.urgency-dot.critical { background: #ef4444; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

/* Urgency toggle buttons in modal */
.urgency-toggles { display: flex; gap: 6px; }
.urgency-btn {
  flex: 1; padding: 8px; border-radius: 8px; border: 2px solid var(--border);
  background: transparent; color: var(--text-muted); font-size: 0.8rem;
  font-weight: 600; cursor: pointer; min-height: 40px; font-family: inherit;
  transition: all 0.15s;
}
.urgency-btn.active[data-urgency="low"] { background: #64748b; border-color: #64748b; color: #fff; }
.urgency-btn.active[data-urgency="medium"] { background: #00d4aa; border-color: #00d4aa; color: #0a1410; }
.urgency-btn.active[data-urgency="high"] { background: #f59e0b; border-color: #f59e0b; color: #fff; }
.urgency-btn.active[data-urgency="critical"] { background: #ef4444; border-color: #ef4444; color: #fff; }

/* Due date badge */
.due-badge { font-size: 0.7rem; padding: 2px 7px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.due-badge.upcoming { background: rgba(255,255,255,0.08); color: var(--text-muted); }
.due-badge.today { background: rgba(0,212,170,0.2); color: #00d4aa; }
.due-badge.overdue { background: rgba(244,63,94,0.2); color: #f43f5e; }

/* Notes area */
.task-notes-wrap { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
.task-notes-wrap.open { max-height: 500px; }
.task-notes { padding: 6px 8px 10px 46px; font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; word-break: break-word; }
.task-notes a { color: #00d4aa; text-decoration: underline; }
.notes-icon {
  color: var(--text-muted); font-size: 0.85rem; flex-shrink: 0; cursor: pointer;
  padding: 4px; min-width: 28px; min-height: 44px; display: flex;
  align-items: center; justify-content: center; background: none; border: none;
  border-radius: 6px; transition: background 0.15s, color 0.15s;
}
.notes-icon:hover { background: var(--surface-hover); color: var(--text); }

/* Textarea in modal */
textarea.form-input { resize: vertical; min-height: 60px; font-family: inherit; }

/* Preview urgency dot */
.preview-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

/* Completed animation */
.task-completing .task-title {
  text-decoration: line-through;
  opacity: 0.5;
  transition: opacity 0.3s;
}

/* Project expand arrow */
.project-expand-arrow {
  cursor: pointer; flex-shrink: 0; font-size: 0.7rem;
  color: var(--text-muted); transition: transform 0.2s;
  padding: 4px; width: 22px; min-height: 22px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none;
}
.project-expand-arrow:hover { color: var(--text); }
.task-wrapper[data-expanded="true"] .project-expand-arrow {
  transform: rotate(90deg);
}

/* Project content column — stacks title row and meta row */
.project-content {
  flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;
}
.project-title-row {
  display: flex; align-items: center; gap: 8px;
}
.project-meta-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}

/* Progress bar */
.project-progress {
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
.progress-bar {
  width: 36px; height: 4px; background: rgba(255,255,255,0.1);
  border-radius: 2px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; border-radius: 2px;
  background: var(--cat-color); transition: width 0.3s;
}
.progress-text {
  font-size: 0.7rem; color: var(--text-muted); white-space: nowrap;
}

/* Subtask indentation */
.subtask-item .task-item {
  padding-left: 12px;
}
.subtask-list {
  border-left: 2px solid rgba(255,255,255,0.06);
  margin-left: 8px;
}

/* Subtask two-row layout */
.subtask-content {
  flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;
}
.subtask-meta-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}

/* Add sub-task button */
.add-subtask-btn {
  display: block; width: calc(100% - 24px); margin: 2px 8px 8px 16px;
  padding: 6px 10px; background: rgba(255,255,255,0.02);
  border: 1px dashed var(--border); border-radius: 6px;
  color: var(--text-muted); font-size: 0.8rem; cursor: pointer;
  min-height: 36px; font-family: inherit;
  transition: background 0.15s, border-color 0.15s;
}
.add-subtask-btn:hover {
  background: rgba(255,255,255,0.06); border-color: var(--cat-color); color: var(--text);
}

/* Type toggle in modal */
.type-toggles { display: flex; gap: 6px; }
.type-btn {
  flex: 1; padding: 8px; border-radius: 8px; border: 2px solid var(--border);
  background: transparent; color: var(--text-muted); font-size: 0.85rem;
  font-weight: 600; cursor: pointer; min-height: 40px; font-family: inherit;
  transition: all 0.15s;
}
.type-btn.active {
  background: var(--work); border-color: var(--work); color: #0a1410;
}
</style>
</head>
<body>

<header>
  <h1>Command Center</h1>
  <div class="date" id="today-date"></div>
  <div class="backup-bar">
    <button class="backup-btn" id="btn-export" title="Export Backup">&#x2B07;</button>
    <button class="backup-btn" id="btn-import" title="Import Backup">&#x2B06;</button>
    <input type="file" id="import-file" accept=".json" class="hidden">
  </div>
</header>

<main id="app"></main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-content">
    <h2 class="modal-title" id="modal-title">Add Task</h2>
    <form id="task-form">
      <div class="form-group">
        <label for="input-title">Task</label>
        <input type="text" id="input-title" class="form-input" placeholder="What needs to be done?" required autocomplete="off">
      </div>
      <div class="form-group" id="project-group">
        <label>Type</label>
        <div class="type-toggles" id="type-toggles">
          <button type="button" class="type-btn active" data-type="task">Task</button>
          <button type="button" class="type-btn" data-type="project">Project</button>
        </div>
      </div>
      <div class="form-group" id="category-group">
        <label for="input-category">Category</label>
        <select id="input-category" class="form-select">
          <option value="fitness">Fitness</option>
          <option value="work">Work</option>
          <option value="personal">Personal Errands</option>
          <option value="education">Education</option>
        </select>
      </div>
      <div class="form-group">
        <label for="input-recurrence">Recurrence</label>
        <select id="input-recurrence" class="form-select">
          <option value="none">One-time</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="custom">Every N days</option>
        </select>
      </div>
      <div class="form-group hidden" id="weekly-group">
        <label>Days</label>
        <div class="day-toggles" id="day-toggles">
          <button type="button" class="day-toggle" data-day="0">Su</button>
          <button type="button" class="day-toggle" data-day="1">Mo</button>
          <button type="button" class="day-toggle" data-day="2">Tu</button>
          <button type="button" class="day-toggle" data-day="3">We</button>
          <button type="button" class="day-toggle" data-day="4">Th</button>
          <button type="button" class="day-toggle" data-day="5">Fr</button>
          <button type="button" class="day-toggle" data-day="6">Sa</button>
        </div>
      </div>
      <div class="form-group hidden" id="custom-group">
        <label for="input-interval">Every how many days?</label>
        <input type="number" id="input-interval" class="form-input" min="2" max="365" value="2">
      </div>
      <div class="form-group">
        <label>Urgency</label>
        <div class="urgency-toggles" id="urgency-toggles">
          <button type="button" class="urgency-btn" data-urgency="low">Low</button>
          <button type="button" class="urgency-btn active" data-urgency="medium">Medium</button>
          <button type="button" class="urgency-btn" data-urgency="high">High</button>
          <button type="button" class="urgency-btn" data-urgency="critical">Critical</button>
        </div>
      </div>
      <div class="form-group">
        <label for="input-due-date">Due Date (optional)</label>
        <input type="date" id="input-due-date" class="form-input">
      </div>
      <div class="form-group">
        <label for="input-notes">Notes (optional)</label>
        <textarea id="input-notes" class="form-input" rows="3" placeholder="Add notes or links..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
        <button type="button" class="btn btn-danger hidden" id="btn-delete">Delete</button>
        <button type="submit" class="btn btn-primary" id="btn-save">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
(function() {
  'use strict';

  const STORAGE_KEY = 'nextaction_tasks';
  const VERSION_KEY = 'nextaction_version';
  const CURRENT_VERSION = 3;

  // Versioned migration functions: each takes the tasks array and mutates it in place.
  // When adding a new schema version, add a migration here and bump CURRENT_VERSION.
  var MIGRATIONS = {
    // v1 -> v2: add urgency, dueDate, notes
    2: function(arr) {
      arr.forEach(function(t) {
        if (!t.urgency) t.urgency = 'medium';
        if (t.dueDate === undefined) t.dueDate = null;
        if (t.notes === undefined) t.notes = '';
      });
    },
    // v2 -> v3: add isProject, parentId, subtaskOrder for project support
    3: function(arr) {
      arr.forEach(function(t) {
        if (t.isProject === undefined) t.isProject = false;
        if (t.parentId === undefined) t.parentId = null;
        if (t.subtaskOrder === undefined) t.subtaskOrder = [];
      });
    }
  };

  function runMigrations(arr, fromVersion) {
    for (var v = fromVersion + 1; v <= CURRENT_VERSION; v++) {
      if (MIGRATIONS[v]) MIGRATIONS[v](arr);
    }
  }

  const CATEGORIES = [
    { id: 'fitness',   name: 'Fitness',          icon: '\uD83D\uDCAA' },
    { id: 'work',      name: 'Work',             icon: '\uD83D\uDCBC' },
    { id: 'personal',  name: 'Personal Errands', icon: '\uD83C\uDFE0' },
    { id: 'education', name: 'Education',         icon: '\uD83D\uDCDA' }
  ];

  const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  let tasks = [];
  let expandedCategories = new Set();
  let expandedNotes = new Set();
  let expandedProjects = new Set();
  let editingTaskId = null;
  let modalParentId = null;
  let lastDateStr = '';

  const URGENCY_WEIGHTS = { critical: 0, high: 1, medium: 2, low: 3 };
  const URGENCY_COLORS = { low: '#64748b', medium: '#00d4aa', high: '#f59e0b', critical: '#f43f5e' };

  // --- Date Utilities ---
  function getTodayStr() {
    const d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function formatDateDisplay(str) {
    const d = new Date(str + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function isScheduledForToday(task, todayStr) {
    if (!task.recurring) return true;
    const today = new Date(todayStr + 'T00:00:00');
    switch (task.recurring.type) {
      case 'daily': return true;
      case 'weekly': return task.recurring.days.includes(today.getDay());
      case 'custom': {
        const created = new Date(task.createdAt.slice(0, 10) + 'T00:00:00');
        const diff = Math.round((today - created) / 86400000);
        return diff >= 0 && (diff % task.recurring.interval) === 0;
      }
      default: return true;
    }
  }

  function isTaskVisible(task, todayStr) {
    if (!task.recurring) return task.completions.length === 0;
    return !task.completions.includes(todayStr) && isScheduledForToday(task, todayStr);
  }

  function getRecurrenceLabel(task) {
    if (!task.recurring) return '';
    switch (task.recurring.type) {
      case 'daily': return 'Daily';
      case 'weekly': {
        const days = task.recurring.days.map(d => DAY_NAMES[d]).join(', ');
        return days;
      }
      case 'custom': return 'Every ' + task.recurring.interval + 'd';
      default: return '';
    }
  }

  // --- Data Layer ---
  function loadTasks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : [];
    } catch (e) {
      tasks = [];
    }
    var storedVersion = parseInt(localStorage.getItem(VERSION_KEY), 10) || 1;
    if (storedVersion < CURRENT_VERSION) {
      runMigrations(tasks, storedVersion);
      saveTasks();
    }
    pruneOldData();
  }

  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    localStorage.setItem(VERSION_KEY, String(CURRENT_VERSION));
  }

  function pruneOldData() {
    const now = Date.now();
    const day90 = 90 * 86400000;
    const day30 = 30 * 86400000;
    // Collect active project IDs (incomplete projects)
    var activeProjectIds = new Set();
    tasks.forEach(function(t) {
      if (t.isProject && (!t.completions.length || t.recurring)) activeProjectIds.add(t.id);
    });
    tasks = tasks.filter(function(t) {
      // Don't prune subtasks of active projects
      if (t.parentId && activeProjectIds.has(t.parentId)) return true;
      if (!t.recurring && t.completions.length > 0) {
        const completedDate = new Date(t.completions[0] + 'T00:00:00').getTime();
        return (now - completedDate) < day30;
      }
      return true;
    });
    tasks.forEach(function(t) {
      if (t.recurring && t.completions.length > 0) {
        t.completions = t.completions.filter(function(d) {
          return (now - new Date(d + 'T00:00:00').getTime()) < day90;
        });
      }
    });
  }

  function getUrgencyWeight(task, todayStr) {
    var w = URGENCY_WEIGHTS[task.urgency] !== undefined ? URGENCY_WEIGHTS[task.urgency] : 2;
    if (task.dueDate && task.dueDate <= todayStr && w > 0) w--;
    return w;
  }

  function getEffectiveDueDate(task) {
    if (task.dueDate) return task.dueDate;
    if (task.parentId) {
      var parent = tasks.find(function(t) { return t.id === task.parentId; });
      return parent ? parent.dueDate : null;
    }
    return null;
  }

  function getVisibleTasks(category) {
    const todayStr = getTodayStr();
    return tasks
      .filter(function(t) { return t.category === category && !t.parentId && isTaskVisible(t, todayStr); })
      .sort(function(a, b) {
        // 1. Soonest due date first (tasks with due dates before those without)
        var aDue = a.dueDate || '';
        var bDue = b.dueDate || '';
        if (aDue || bDue) {
          if (aDue && !bDue) return -1;
          if (!aDue && bDue) return 1;
          if (aDue < bDue) return -1;
          if (aDue > bDue) return 1;
        }
        // 2. Same due date (or both none): highest urgency first
        var ua = getUrgencyWeight(a, todayStr);
        var ub = getUrgencyWeight(b, todayStr);
        if (ua !== ub) return ua - ub;
        // 3. Manual sort order as final tiebreaker
        return a.sortOrder - b.sortOrder;
      });
  }

  function getVisibleSubtasks(projectId) {
    var todayStr = getTodayStr();
    var project = tasks.find(function(t) { return t.id === projectId; });
    var order = (project && project.subtaskOrder) || [];
    return tasks
      .filter(function(t) { return t.parentId === projectId && isTaskVisible(t, todayStr); })
      .sort(function(a, b) {
        var ai = order.indexOf(a.id);
        var bi = order.indexOf(b.id);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });
  }

  function getAllSubtasks(projectId) {
    return tasks.filter(function(t) { return t.parentId === projectId; });
  }

  function getSubtaskProgress(projectId) {
    var todayStr = getTodayStr();
    var subs = getAllSubtasks(projectId);
    var done = subs.filter(function(t) {
      if (!t.recurring) return t.completions.length > 0;
      return t.completions.includes(todayStr);
    }).length;
    return { done: done, total: subs.length };
  }

  function getNextAction(task) {
    if (!task.isProject) return task;
    var subs = getVisibleSubtasks(task.id);
    return subs.length > 0 ? subs[0] : task;
  }

  function getTasksByCategory(category) {
    return tasks
      .filter(function(t) { return t.category === category; })
      .sort(function(a, b) { return a.sortOrder - b.sortOrder; });
  }

  function nextSortOrder(category) {
    const catTasks = tasks.filter(function(t) { return t.category === category; });
    if (catTasks.length === 0) return 0;
    return Math.max.apply(null, catTasks.map(function(t) { return t.sortOrder; })) + 1;
  }

  // --- CRUD ---
  function createTask(title, category, recurring, urgency, dueDate, notes, isProject, parentId) {
    var id;
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
      id = crypto.randomUUID();
    } else {
      id = Date.now().toString(36) + Math.random().toString(36).slice(2);
    }
    const task = {
      id: id,
      category: category,
      title: title.trim(),
      recurring: recurring,
      completions: [],
      createdAt: new Date().toISOString(),
      sortOrder: nextSortOrder(category),
      urgency: urgency || 'medium',
      dueDate: dueDate || null,
      notes: notes || '',
      isProject: !!isProject,
      parentId: parentId || null,
      subtaskOrder: []
    };
    tasks.push(task);
    if (parentId) {
      var parent = tasks.find(function(t) { return t.id === parentId; });
      if (parent) parent.subtaskOrder.push(id);
    }
    saveTasks();
    return task;
  }

  function updateTask(id, updates) {
    const task = tasks.find(function(t) { return t.id === id; });
    if (!task) return;
    Object.assign(task, updates);
    saveTasks();
  }

  function deleteTask(id) {
    var task = tasks.find(function(t) { return t.id === id; });
    if (task && task.isProject) {
      // Cascade delete all subtasks
      tasks = tasks.filter(function(t) { return t.parentId !== id && t.id !== id; });
    } else {
      // Remove subtask from parent's subtaskOrder
      if (task && task.parentId) {
        var parent = tasks.find(function(t) { return t.id === task.parentId; });
        if (parent) {
          parent.subtaskOrder = parent.subtaskOrder.filter(function(sid) { return sid !== id; });
        }
      }
      tasks = tasks.filter(function(t) { return t.id !== id; });
    }
    saveTasks();
  }

  function completeTask(id) {
    const task = tasks.find(function(t) { return t.id === id; });
    if (!task) return;
    const todayStr = getTodayStr();
    if (!task.completions.includes(todayStr)) {
      task.completions.push(todayStr);
    }
    saveTasks();
    // Auto-complete project when all subtasks are done
    if (task.parentId) {
      var progress = getSubtaskProgress(task.parentId);
      if (progress.total > 0 && progress.done === progress.total) {
        if (confirm('All sub-tasks complete! Mark project as done?')) {
          var parent = tasks.find(function(t) { return t.id === task.parentId; });
          if (parent && !parent.completions.includes(todayStr)) {
            parent.completions.push(todayStr);
            saveTasks();
          }
        }
      }
    }
  }

  function reorderCategory(category, orderedIds) {
    orderedIds.forEach(function(id, i) {
      const task = tasks.find(function(t) { return t.id === id; });
      if (task) task.sortOrder = i;
    });
    saveTasks();
  }

  function reorderSubtasks(projectId, orderedIds) {
    var project = tasks.find(function(t) { return t.id === projectId; });
    if (project) {
      project.subtaskOrder = orderedIds;
      saveTasks();
    }
  }

  // Move a task to a new context (different category, into a project, or out of a project)
  function moveTask(taskId, destCategory, destProjectId) {
    var task = tasks.find(function(t) { return t.id === taskId; });
    if (!task) return;

    // Don't allow moving a project into another project
    if (task.isProject && destProjectId) return;

    // Remove from old parent's subtaskOrder if it was a subtask
    if (task.parentId) {
      var oldParent = tasks.find(function(t) { return t.id === task.parentId; });
      if (oldParent) {
        oldParent.subtaskOrder = oldParent.subtaskOrder.filter(function(sid) { return sid !== taskId; });
      }
    }

    // Also move subtasks to new category if moving a project across categories
    var oldCategory = task.category;

    if (destProjectId) {
      // Moving into a project as subtask
      var destProject = tasks.find(function(t) { return t.id === destProjectId; });
      if (!destProject) return;
      task.parentId = destProjectId;
      task.category = destProject.category;
      if (destProject.subtaskOrder.indexOf(taskId) === -1) {
        destProject.subtaskOrder.push(taskId);
      }
    } else {
      // Moving to top-level in a category
      task.parentId = null;
      task.category = destCategory;
      task.sortOrder = nextSortOrder(destCategory);
    }

    if (task.isProject && task.category !== oldCategory) {
      tasks.forEach(function(t) {
        if (t.parentId === taskId) t.category = task.category;
      });
    }

    saveTasks();
  }

  // --- Helpers ---
  function linkifyText(text, container) {
    var urlRegex = /(https?:\/\/[^\s<]+)/g;
    var lastIdx = 0;
    var match;
    while ((match = urlRegex.exec(text)) !== null) {
      if (match.index > lastIdx) {
        container.appendChild(document.createTextNode(text.slice(lastIdx, match.index)));
      }
      var a = document.createElement('a');
      a.href = match[1];
      a.textContent = match[1];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      container.appendChild(a);
      lastIdx = urlRegex.lastIndex;
    }
    if (lastIdx < text.length) {
      container.appendChild(document.createTextNode(text.slice(lastIdx)));
    }
  }

  function formatDueDate(dateStr, todayStr) {
    if (!dateStr) return null;
    var d = new Date(dateStr + 'T00:00:00');
    var label = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    if (dateStr < todayStr) return { text: 'Overdue', cls: 'overdue' };
    if (dateStr === todayStr) return { text: 'Due today', cls: 'today' };
    return { text: 'Due ' + label, cls: 'upcoming' };
  }

  // --- Rendering ---
  function render() {
    const app = document.getElementById('app');
    app.textContent = '';
    const todayStr = getTodayStr();
    document.getElementById('today-date').textContent = formatDateDisplay(todayStr);
    lastDateStr = todayStr;

    CATEGORIES.forEach(function(cat) {
      const section = document.createElement('section');
      section.className = 'category' + (expandedCategories.has(cat.id) ? ' expanded' : '');
      section.dataset.category = cat.id;

      const visible = getVisibleTasks(cat.id);
      const nextTask = visible[0] || null;

      // Header
      const header = document.createElement('div');
      header.className = 'category-header';
      header.setAttribute('role', 'button');
      header.setAttribute('tabindex', '0');
      header.setAttribute('aria-expanded', expandedCategories.has(cat.id) ? 'true' : 'false');

      const icon = document.createElement('span');
      icon.className = 'category-icon';
      icon.textContent = cat.icon;

      const name = document.createElement('span');
      name.className = 'category-name';
      name.textContent = cat.name;

      var preview;
      if (nextTask) {
        var previewTask = getNextAction(nextTask);
        preview = document.createElement('span');
        preview.className = 'inline-task';

        var dot = document.createElement('span');
        dot.className = 'urgency-dot ' + (previewTask.urgency || 'medium');
        preview.appendChild(dot);

        var inlineCheck = document.createElement('input');
        inlineCheck.type = 'checkbox';
        inlineCheck.className = 'inline-task-check';
        inlineCheck.dataset.id = previewTask.id;
        inlineCheck.setAttribute('aria-label', 'Complete ' + previewTask.title);
        preview.appendChild(inlineCheck);

        if (nextTask.isProject && previewTask.id !== nextTask.id) {
          var projLabel = document.createElement('span');
          projLabel.className = 'inline-project-label';
          projLabel.textContent = nextTask.title + ':';
          preview.appendChild(projLabel);
        }

        var inlineTitle = document.createElement('span');
        inlineTitle.className = 'inline-task-title';
        inlineTitle.textContent = previewTask.title;
        preview.appendChild(inlineTitle);
      } else {
        preview = document.createElement('span');
        preview.className = 'next-preview';
        preview.textContent = 'No tasks';
      }

      const arrow = document.createElement('span');
      arrow.className = 'expand-arrow';
      arrow.textContent = '\u25BC';

      header.appendChild(icon);
      header.appendChild(name);
      header.appendChild(preview);
      header.appendChild(arrow);

      // Body
      const body = document.createElement('div');
      body.className = 'category-body';

      const list = document.createElement('div');
      list.className = 'task-list';
      list.dataset.category = cat.id;

      if (visible.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-msg';
        empty.textContent = 'No tasks scheduled for today';
        list.appendChild(empty);
      } else {
        visible.forEach(function(task, idx) {
          list.appendChild(renderTaskItem(task, idx === 0));
          // Render subtasks if this is an expanded project
          if (task.isProject && expandedProjects.has(task.id)) {
            var subtasks = getVisibleSubtasks(task.id);
            var subtaskList = document.createElement('div');
            subtaskList.className = 'subtask-list task-list';
            subtaskList.dataset.projectId = task.id;
            subtaskList.dataset.category = cat.id;
            if (subtasks.length === 0) {
              var emptyS = document.createElement('div');
              emptyS.className = 'empty-msg';
              emptyS.textContent = 'No sub-tasks yet';
              subtaskList.appendChild(emptyS);
            } else {
              subtasks.forEach(function(sub) {
                subtaskList.appendChild(renderTaskItem(sub, false, true));
              });
            }
            list.appendChild(subtaskList);
            var addSubBtn = document.createElement('button');
            addSubBtn.className = 'add-subtask-btn';
            addSubBtn.dataset.projectId = task.id;
            addSubBtn.textContent = '+ Add Sub-task';
            list.appendChild(addSubBtn);

          }
        });
      }

      const addBtn = document.createElement('button');
      addBtn.className = 'add-task-btn';
      addBtn.dataset.category = cat.id;
      addBtn.textContent = '+ Add Task';

      body.appendChild(list);
      body.appendChild(addBtn);
      section.appendChild(header);
      section.appendChild(body);
      app.appendChild(section);


    });
  }

  function renderTaskItem(task, isFirst, isSubtask) {
    var todayStr = getTodayStr();
    var wrapper = document.createElement('div');
    wrapper.className = 'task-wrapper' + (isSubtask ? ' subtask-item' : '');
    wrapper.dataset.id = task.id;
    if (task.isProject) {
      wrapper.dataset.expanded = expandedProjects.has(task.id) ? 'true' : 'false';
    }

    const li = document.createElement('div');
    li.className = 'task-item' + (isFirst ? ' first-task' : '');
    li.dataset.id = task.id;
    li.setAttribute('draggable', 'true');

    const handle = document.createElement('span');
    handle.className = 'drag-handle';
    handle.textContent = '\u2630';

    var urgDot = document.createElement('span');
    urgDot.className = 'urgency-dot ' + (task.urgency || 'medium');

    li.appendChild(handle);
    li.appendChild(urgDot);

    if (task.isProject) {
      // Project: expand arrow instead of checkbox
      var projArrow = document.createElement('button');
      projArrow.className = 'project-expand-arrow';
      projArrow.setAttribute('aria-label', 'Expand project');
      projArrow.textContent = '\u25B6';
      li.appendChild(projArrow);
    } else {
      const check = document.createElement('input');
      check.type = 'checkbox';
      check.className = 'task-check';
      check.setAttribute('aria-label', 'Complete ' + task.title);
      li.appendChild(check);
    }

    if (task.isProject) {
      // Project: two-row layout (title+progress on top, due date + badges below)
      var contentCol = document.createElement('div');
      contentCol.className = 'project-content';

      var titleRow = document.createElement('div');
      titleRow.className = 'project-title-row';
      var title = document.createElement('span');
      title.className = 'task-title';
      title.textContent = task.title;
      titleRow.appendChild(title);

      var progress = getSubtaskProgress(task.id);
      var progressEl = document.createElement('span');
      progressEl.className = 'project-progress';
      var bar = document.createElement('span');
      bar.className = 'progress-bar';
      var fill = document.createElement('span');
      fill.className = 'progress-bar-fill';
      fill.style.width = (progress.total > 0 ? Math.round((progress.done / progress.total) * 100) : 0) + '%';
      bar.appendChild(fill);
      var ptext = document.createElement('span');
      ptext.className = 'progress-text';
      ptext.textContent = progress.done + '/' + progress.total;
      progressEl.appendChild(bar);
      progressEl.appendChild(ptext);
      titleRow.appendChild(progressEl);
      contentCol.appendChild(titleRow);

      var metaRow = document.createElement('div');
      metaRow.className = 'project-meta-row';
      var dueInfo = formatDueDate(task.dueDate, todayStr);
      if (dueInfo) {
        var dueBadge = document.createElement('span');
        dueBadge.className = 'due-badge ' + dueInfo.cls;
        dueBadge.textContent = dueInfo.text;
        metaRow.appendChild(dueBadge);
      }
      if (task.notes) {
        var notesBtn = document.createElement('button');
        notesBtn.className = 'notes-icon';
        notesBtn.setAttribute('aria-label', 'Toggle notes');
        notesBtn.textContent = '\uD83D\uDCDD';
        notesBtn.dataset.id = task.id;
        metaRow.appendChild(notesBtn);
      }
      if (metaRow.children.length > 0) contentCol.appendChild(metaRow);

      li.appendChild(contentCol);

      var editBtn = document.createElement('button');
      editBtn.className = 'task-edit-btn';
      editBtn.setAttribute('aria-label', 'Edit task');
      editBtn.textContent = '\u270E';
      li.appendChild(editBtn);
    } else if (isSubtask) {
      // Subtask: two-row layout (title on top, meta below)
      var contentCol = document.createElement('div');
      contentCol.className = 'subtask-content';

      var title = document.createElement('span');
      title.className = 'task-title';
      title.textContent = task.title;
      contentCol.appendChild(title);

      var metaRow = document.createElement('div');
      metaRow.className = 'subtask-meta-row';

      var label = getRecurrenceLabel(task);
      if (label) {
        var badge = document.createElement('span');
        badge.className = 'recurrence-badge';
        badge.textContent = label;
        metaRow.appendChild(badge);
      }

      var effectiveDue = getEffectiveDueDate(task);
      var dueInfo = formatDueDate(effectiveDue, todayStr);
      if (dueInfo) {
        var dueBadge = document.createElement('span');
        dueBadge.className = 'due-badge ' + dueInfo.cls;
        dueBadge.textContent = dueInfo.text;
        if (!task.dueDate && effectiveDue) dueBadge.style.opacity = '0.6';
        metaRow.appendChild(dueBadge);
      }

      if (task.notes) {
        var notesBtn = document.createElement('button');
        notesBtn.className = 'notes-icon';
        notesBtn.setAttribute('aria-label', 'Toggle notes');
        notesBtn.textContent = '\uD83D\uDCDD';
        notesBtn.dataset.id = task.id;
        metaRow.appendChild(notesBtn);
      }

      if (metaRow.children.length > 0) contentCol.appendChild(metaRow);
      li.appendChild(contentCol);

      var editBtn = document.createElement('button');
      editBtn.className = 'task-edit-btn';
      editBtn.setAttribute('aria-label', 'Edit task');
      editBtn.textContent = '\u270E';
      li.appendChild(editBtn);
    } else {
      // Regular top-level task: single-row layout
      var title = document.createElement('span');
      title.className = 'task-title';
      title.textContent = task.title;
      li.appendChild(title);

      var label = getRecurrenceLabel(task);
      if (label) {
        var badge = document.createElement('span');
        badge.className = 'recurrence-badge';
        badge.textContent = label;
        li.appendChild(badge);
      }

      var dueInfo = formatDueDate(task.dueDate, todayStr);
      if (dueInfo) {
        var dueBadge = document.createElement('span');
        dueBadge.className = 'due-badge ' + dueInfo.cls;
        dueBadge.textContent = dueInfo.text;
        li.appendChild(dueBadge);
      }

      if (task.notes) {
        var notesBtn = document.createElement('button');
        notesBtn.className = 'notes-icon';
        notesBtn.setAttribute('aria-label', 'Toggle notes');
        notesBtn.textContent = '\uD83D\uDCDD';
        notesBtn.dataset.id = task.id;
        li.appendChild(notesBtn);
      }

      var editBtn = document.createElement('button');
      editBtn.className = 'task-edit-btn';
      editBtn.setAttribute('aria-label', 'Edit task');
      editBtn.textContent = '\u270E';
      li.appendChild(editBtn);
    }

    wrapper.appendChild(li);

    if (task.notes) {
      var notesWrap = document.createElement('div');
      notesWrap.className = 'task-notes-wrap' + (expandedNotes.has(task.id) ? ' open' : '');
      notesWrap.dataset.notesFor = task.id;
      var notesDiv = document.createElement('div');
      notesDiv.className = 'task-notes';
      linkifyText(task.notes, notesDiv);
      notesWrap.appendChild(notesDiv);
      wrapper.appendChild(notesWrap);
    }

    return wrapper;
  }

  // --- Modal ---
  function setActiveType(type) {
    document.querySelectorAll('.type-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.type === type);
    });
    var isProject = (type === 'project');
    var recurrenceGroup = document.getElementById('input-recurrence').closest('.form-group');
    recurrenceGroup.classList.toggle('hidden', isProject);
    if (isProject) {
      document.getElementById('weekly-group').classList.add('hidden');
      document.getElementById('custom-group').classList.add('hidden');
    }
  }

  function getActiveType() {
    var active = document.querySelector('.type-btn.active');
    return active ? active.dataset.type : 'task';
  }

  function openModal(mode, task, defaultCategory, parentId) {
    editingTaskId = (mode === 'edit' && task) ? task.id : null;
    modalParentId = parentId || null;
    const overlay = document.getElementById('modal-overlay');
    const titleEl = document.getElementById('modal-title');
    const form = document.getElementById('task-form');
    const deleteBtn = document.getElementById('btn-delete');
    const categoryGroup = document.getElementById('category-group');
    const projectGroup = document.getElementById('project-group');
    var recurrenceGroup = document.getElementById('input-recurrence').closest('.form-group');

    // Reset visibility
    categoryGroup.classList.remove('hidden');
    projectGroup.classList.remove('hidden');
    recurrenceGroup.classList.remove('hidden');

    form.reset();
    clearDayToggles();
    setActiveUrgency('medium');
    setActiveType('task');
    document.getElementById('input-due-date').value = '';
    document.getElementById('input-notes').value = '';

    if (modalParentId) {
      // Sub-task mode
      titleEl.textContent = mode === 'edit' ? 'Edit Sub-task' : 'Add Sub-task';
      categoryGroup.classList.add('hidden');
      projectGroup.classList.add('hidden');
    } else if (mode === 'edit') {
      titleEl.textContent = task && task.parentId ? 'Edit Sub-task' : 'Edit Task';
      if (task && task.parentId) {
        categoryGroup.classList.add('hidden');
        projectGroup.classList.add('hidden');
        modalParentId = task.parentId;
      }
    } else {
      titleEl.textContent = 'Add Task';
    }

    deleteBtn.classList.toggle('hidden', mode !== 'edit');

    if (mode === 'edit' && task) {
      document.getElementById('input-title').value = task.title;
      document.getElementById('input-category').value = task.category;
      setActiveUrgency(task.urgency || 'medium');
      document.getElementById('input-due-date').value = task.dueDate || '';
      document.getElementById('input-notes').value = task.notes || '';
      if (task.isProject) {
        setActiveType('project');
      }
      if (task.recurring) {
        document.getElementById('input-recurrence').value = task.recurring.type;
        if (task.recurring.type === 'weekly') {
          task.recurring.days.forEach(function(d) {
            const btn = document.querySelector('.day-toggle[data-day="' + d + '"]');
            if (btn) btn.classList.add('active');
          });
        } else if (task.recurring.type === 'custom') {
          document.getElementById('input-interval').value = task.recurring.interval;
        }
      } else {
        document.getElementById('input-recurrence').value = 'none';
      }
    } else if (defaultCategory) {
      document.getElementById('input-category').value = defaultCategory;
    }

    if (!modalParentId) updateRecurrenceUI();
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(function() {
      document.getElementById('input-title').focus();
    }, 100);
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
    editingTaskId = null;
    modalParentId = null;
  }

  function updateRecurrenceUI() {
    const type = document.getElementById('input-recurrence').value;
    document.getElementById('weekly-group').classList.toggle('hidden', type !== 'weekly');
    document.getElementById('custom-group').classList.toggle('hidden', type !== 'custom');
  }

  function setActiveUrgency(level) {
    document.querySelectorAll('.urgency-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.urgency === level);
    });
  }

  function getActiveUrgency() {
    var active = document.querySelector('.urgency-btn.active');
    return active ? active.dataset.urgency : 'medium';
  }

  function clearDayToggles() {
    document.querySelectorAll('.day-toggle').forEach(function(btn) {
      btn.classList.remove('active');
    });
  }

  function getSelectedDays() {
    var days = [];
    document.querySelectorAll('.day-toggle.active').forEach(function(btn) {
      days.push(parseInt(btn.dataset.day, 10));
    });
    return days.sort();
  }

  function buildRecurring() {
    const type = document.getElementById('input-recurrence').value;
    if (type === 'none') return null;
    if (type === 'daily') return { type: 'daily', days: [], interval: 1 };
    if (type === 'weekly') {
      const days = getSelectedDays();
      if (days.length === 0) return null;
      return { type: 'weekly', days: days, interval: 0 };
    }
    if (type === 'custom') {
      const interval = parseInt(document.getElementById('input-interval').value, 10);
      if (!interval || interval < 2) return null;
      return { type: 'custom', days: [], interval: interval };
    }
    return null;
  }

  function handleFormSubmit(e) {
    e.preventDefault();
    const title = document.getElementById('input-title').value.trim();
    if (!title) return;
    const urgency = getActiveUrgency();
    const dueDate = document.getElementById('input-due-date').value || null;
    const notes = document.getElementById('input-notes').value.trim();
    var isProject = getActiveType() === 'project';
    var recurring = isProject ? null : buildRecurring();

    if (editingTaskId) {
      var editTask = tasks.find(function(t) { return t.id === editingTaskId; });
      var updates = {
        title: title, urgency: urgency, dueDate: dueDate, notes: notes
      };
      if (!editTask.parentId && !modalParentId) {
        updates.category = document.getElementById('input-category').value;
        updates.isProject = isProject;
        updates.recurring = recurring;
        if (isProject) updates.recurring = null;
      } else {
        updates.recurring = recurring;
      }
      updateTask(editingTaskId, updates);
    } else if (modalParentId) {
      // Creating a subtask
      var parentTask = tasks.find(function(t) { return t.id === modalParentId; });
      var category = parentTask ? parentTask.category : document.getElementById('input-category').value;
      createTask(title, category, recurring, urgency, dueDate, notes, false, modalParentId);
      expandedProjects.add(modalParentId);
      if (parentTask && !expandedCategories.has(parentTask.category)) {
        expandedCategories.add(parentTask.category);
      }
    } else {
      var category = document.getElementById('input-category').value;
      createTask(title, category, recurring, urgency, dueDate, notes, isProject, null);
      if (!expandedCategories.has(category)) {
        expandedCategories.add(category);
      }
      if (isProject) {
        // Auto-expand the new project
        var newest = tasks[tasks.length - 1];
        if (newest) expandedProjects.add(newest.id);
      }
    }
    closeModal();
    render();
  }

  // --- Drag and Drop (Global — supports cross-category and task↔subtask moves) ---
  let draggedId = null;

  function clearAllDropIndicators() {
    document.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(function(el) {
      el.classList.remove('drag-over-top', 'drag-over-bottom');
    });
  }

  function getListContext(listEl) {
    if (!listEl) return null;
    if (listEl.dataset.projectId) return { type: 'project', projectId: listEl.dataset.projectId, category: listEl.dataset.category };
    if (listEl.dataset.category) return { type: 'category', category: listEl.dataset.category };
    return null;
  }

  function finalizeDrag(targetListEl, movedId, targetId, insertBefore) {
    var movedTask = tasks.find(function(t) { return t.id === movedId; });
    if (!movedTask) return;
    var targetTask = tasks.find(function(t) { return t.id === targetId; });
    if (!targetTask) return;

    var destCtx = getListContext(targetListEl);
    if (!destCtx) return;

    // Don't allow dropping a project into a subtask list
    if (movedTask.isProject && destCtx.type === 'project') return;

    // Determine source context
    var srcProjectId = movedTask.parentId || null;
    var srcCategory = movedTask.category;
    var destProjectId = destCtx.type === 'project' ? destCtx.projectId : null;
    var destCategory = destCtx.category;

    var crossMove = false;
    // Check if this is a cross-context move
    if (srcProjectId !== destProjectId || srcCategory !== destCategory) {
      crossMove = true;
      moveTask(movedId, destCategory, destProjectId);
    }

    // Now reorder within the destination list
    var visible;
    if (destProjectId) {
      visible = getVisibleSubtasks(destProjectId);
    } else {
      visible = getVisibleTasks(destCategory);
    }
    var ids = visible.map(function(t) { return t.id; });
    // If cross-move, movedId might already be at end; remove it for re-insert
    var fromIdx = ids.indexOf(movedId);
    if (fromIdx !== -1) ids.splice(fromIdx, 1);
    var toIdx = ids.indexOf(targetId);
    if (toIdx === -1) {
      ids.push(movedId);
    } else {
      if (!insertBefore) toIdx++;
      ids.splice(toIdx, 0, movedId);
    }
    if (destProjectId) {
      reorderSubtasks(destProjectId, ids);
    } else {
      reorderCategory(destCategory, ids);
    }
    render();
  }

  // Resolve where a drop lands: returns { listEl, targetId, insertBefore } or
  // { moveOnly: true, destCategory, destProjectId } for zone-based drops.
  function resolveDropTarget(el, clientY) {
    // 1. Dropped on a task-item — standard reorder / cross-list move
    var taskItem = el.closest('.task-item');
    if (taskItem && taskItem.dataset.id !== draggedId) {
      var listEl = taskItem.closest('.task-list');
      if (listEl) {
        var rect = taskItem.getBoundingClientRect();
        return { listEl: listEl, targetId: taskItem.dataset.id, insertBefore: clientY < rect.top + rect.height / 2 };
      }
    }
    // 2. Dropped on an expanded project's subtask area (empty msg, add-subtask btn, or subtask-list gap)
    var subtaskList = el.closest('.subtask-list');
    if (subtaskList && subtaskList.dataset.projectId) {
      return { moveOnly: true, destCategory: subtaskList.dataset.category, destProjectId: subtaskList.dataset.projectId };
    }
    var addSubBtn = el.closest('.add-subtask-btn');
    if (addSubBtn && addSubBtn.dataset.projectId) {
      var proj = tasks.find(function(t) { return t.id === addSubBtn.dataset.projectId; });
      return { moveOnly: true, destCategory: proj ? proj.category : null, destProjectId: addSubBtn.dataset.projectId };
    }
    // 3. Dropped on a project row itself — add as subtask of that project
    if (taskItem && taskItem.dataset.id) {
      var droppedOnTask = tasks.find(function(t) { return t.id === taskItem.dataset.id; });
      if (droppedOnTask && droppedOnTask.isProject && taskItem.dataset.id !== draggedId) {
        return { moveOnly: true, destCategory: droppedOnTask.category, destProjectId: droppedOnTask.id };
      }
    }
    // 4. Dropped on category header or body — move to that category as top-level
    var catSection = el.closest('.category');
    if (catSection) {
      return { moveOnly: true, destCategory: catSection.dataset.category, destProjectId: null };
    }
    return null;
  }

  function executeDrop(dropInfo) {
    if (!draggedId) return;
    var movedTask = tasks.find(function(t) { return t.id === draggedId; });
    if (!movedTask) return;

    if (dropInfo.moveOnly) {
      // Don't allow dropping a project into another project
      if (movedTask.isProject && dropInfo.destProjectId) return;
      var srcProjectId = movedTask.parentId || null;
      var srcCategory = movedTask.category;
      if (srcProjectId !== dropInfo.destProjectId || srcCategory !== dropInfo.destCategory) {
        moveTask(draggedId, dropInfo.destCategory, dropInfo.destProjectId);
        if (dropInfo.destProjectId) expandedProjects.add(dropInfo.destProjectId);
      }
      render();
    } else {
      finalizeDrag(dropInfo.listEl, draggedId, dropInfo.targetId, dropInfo.insertBefore);
    }
  }

  // Visual feedback for drop zones
  function showDropZoneIndicator(el) {
    clearAllDropIndicators();
    // Highlight task-item
    var taskItem = el.closest('.task-item');
    if (taskItem && taskItem.dataset.id !== draggedId) {
      taskItem.classList.add('drag-over-bottom');
      return;
    }
    // Highlight subtask area or category
    var subtaskList = el.closest('.subtask-list');
    if (subtaskList) { subtaskList.classList.add('drag-over-bottom'); return; }
    var addSubBtn = el.closest('.add-subtask-btn');
    if (addSubBtn) { addSubBtn.classList.add('drag-over-bottom'); return; }
    var catHeader = el.closest('.category-header');
    if (catHeader) { catHeader.classList.add('drag-over-bottom'); return; }
  }

  // Desktop drag (delegated on #app)
  (function() {
    var app = document.getElementById('app');

    app.addEventListener('dragstart', function(e) {
      var li = e.target.closest('.task-item');
      if (!li) return;
      draggedId = li.dataset.id;
      li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', li.dataset.id);
    });

    app.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      clearAllDropIndicators();
      var target = e.target.closest('.task-item');
      if (target && target.dataset.id !== draggedId) {
        var rect = target.getBoundingClientRect();
        var mid = rect.top + rect.height / 2;
        target.classList.add(e.clientY < mid ? 'drag-over-top' : 'drag-over-bottom');
      } else {
        showDropZoneIndicator(e.target);
      }
    });

    app.addEventListener('dragleave', function(e) {
      var target = e.target.closest('.task-item');
      if (target) target.classList.remove('drag-over-top', 'drag-over-bottom');
    });

    app.addEventListener('drop', function(e) {
      e.preventDefault();
      clearAllDropIndicators();
      if (!draggedId) return;
      var dropInfo = resolveDropTarget(e.target, e.clientY);
      if (dropInfo) executeDrop(dropInfo);
    });

    app.addEventListener('dragend', function() {
      clearAllDropIndicators();
      var dragging = document.querySelector('.dragging');
      if (dragging) dragging.classList.remove('dragging');
      draggedId = null;
    });
  })();

  // Touch drag (delegated on #app)
  (function() {
    var app = document.getElementById('app');
    var touchId = null;
    var ghost = null;
    var lastTouchEl = null;

    app.addEventListener('touchstart', function(e) {
      var handle = e.target.closest('.drag-handle');
      if (!handle) return;
      var li = handle.closest('.task-item');
      if (!li) return;

      touchId = li.dataset.id;
      draggedId = touchId;
      li.classList.add('dragging');

      ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      var cat = li.closest('.category');
      if (cat) ghost.style.setProperty('--cat-color', getComputedStyle(cat).getPropertyValue('--cat-color'));
      var titleEl = li.querySelector('.task-title');
      ghost.textContent = titleEl ? titleEl.textContent : '';
      ghost.style.left = '16px';
      ghost.style.top = (e.touches[0].clientY - 20) + 'px';
      document.body.appendChild(ghost);
    }, { passive: true });

    app.addEventListener('touchmove', function(e) {
      if (!touchId || !ghost) return;
      e.preventDefault();

      var touch = e.touches[0];
      ghost.style.top = (touch.clientY - 20) + 'px';

      ghost.style.display = 'none';
      var el = document.elementFromPoint(touch.clientX, touch.clientY);
      ghost.style.display = '';

      clearAllDropIndicators();
      lastTouchEl = el;
      if (el) {
        var target = el.closest('.task-item');
        if (target && target.dataset.id !== touchId) {
          var rect = target.getBoundingClientRect();
          var mid = rect.top + rect.height / 2;
          target.classList.add(touch.clientY < mid ? 'drag-over-top' : 'drag-over-bottom');
        } else {
          showDropZoneIndicator(el);
        }
      }
    }, { passive: false });

    app.addEventListener('touchend', function(e) {
      if (!touchId) return;
      clearAllDropIndicators();
      var dragging = document.querySelector('.dragging');
      if (dragging) dragging.classList.remove('dragging');

      if (lastTouchEl) {
        // Use last known touch position to find element
        var touch = e.changedTouches && e.changedTouches[0];
        var clientY = touch ? touch.clientY : 0;
        var dropInfo = resolveDropTarget(lastTouchEl, clientY);
        if (dropInfo) executeDrop(dropInfo);
      }

      if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
      ghost = null;
      touchId = null;
      draggedId = null;
      lastTouchEl = null;
    });

    app.addEventListener('touchcancel', function() {
      if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
      clearAllDropIndicators();
      var dragging = document.querySelector('.dragging');
      if (dragging) dragging.classList.remove('dragging');
      ghost = null;
      touchId = null;
      draggedId = null;
      lastTouchEl = null;
    });
  })();

  // --- Event Delegation ---
  document.getElementById('app').addEventListener('click', function(e) {
    // Inline task check in collapsed header — must come before header expand/collapse
    var inlineCheck = e.target.closest('.inline-task-check');
    if (inlineCheck) {
      e.stopPropagation();
      var taskId = inlineCheck.dataset.id;
      if (taskId) {
        completeTask(taskId);
        render();
      }
      return;
    }

    // Expand/collapse
    const header = e.target.closest('.category-header');
    if (header) {
      const cat = header.closest('.category').dataset.category;
      if (expandedCategories.has(cat)) {
        expandedCategories.delete(cat);
      } else {
        expandedCategories.add(cat);
      }
      render();
      return;
    }

    // Complete task
    const check = e.target.closest('.task-check');
    if (check) {
      const item = check.closest('.task-item');
      if (!item) return;
      item.classList.add('task-completing');
      setTimeout(function() {
        completeTask(item.dataset.id);
        render();
      }, 300);
      return;
    }

    // Toggle notes
    const notesBtn = e.target.closest('.notes-icon');
    if (notesBtn) {
      var nid = notesBtn.dataset.id;
      if (expandedNotes.has(nid)) {
        expandedNotes.delete(nid);
      } else {
        expandedNotes.add(nid);
      }
      var wrap = document.querySelector('.task-notes-wrap[data-notes-for="' + nid + '"]');
      if (wrap) wrap.classList.toggle('open', expandedNotes.has(nid));
      return;
    }

    // Edit task
    const editBtn = e.target.closest('.task-edit-btn');
    if (editBtn) {
      const item = editBtn.closest('.task-item');
      if (!item) return;
      const task = tasks.find(function(t) { return t.id === item.dataset.id; });
      if (task) openModal('edit', task);
      return;
    }

    // Project expand/collapse
    var projArrow = e.target.closest('.project-expand-arrow');
    if (projArrow) {
      var wrapper = projArrow.closest('.task-wrapper');
      if (wrapper) {
        var pid = wrapper.dataset.id;
        if (expandedProjects.has(pid)) {
          expandedProjects.delete(pid);
        } else {
          expandedProjects.add(pid);
        }
        render();
      }
      return;
    }

    // Add sub-task
    var addSubBtn = e.target.closest('.add-subtask-btn');
    if (addSubBtn) {
      var projectId = addSubBtn.dataset.projectId;
      var project = tasks.find(function(t) { return t.id === projectId; });
      if (project) openModal('add', null, project.category, projectId);
      return;
    }

    // Add task
    const addBtn = e.target.closest('.add-task-btn');
    if (addBtn) {
      openModal('add', null, addBtn.dataset.category);
      return;
    }
  });

  // Keyboard support for headers
  document.getElementById('app').addEventListener('keydown', function(e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.category-header')) {
      e.preventDefault();
      e.target.closest('.category-header').click();
    }
  });

  // Modal events
  document.getElementById('task-form').addEventListener('submit', handleFormSubmit);
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  document.getElementById('input-recurrence').addEventListener('change', updateRecurrenceUI);

  document.getElementById('btn-delete').addEventListener('click', function() {
    if (editingTaskId) {
      deleteTask(editingTaskId);
      closeModal();
      render();
    }
  });

  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  // Day toggle clicks
  document.getElementById('day-toggles').addEventListener('click', function(e) {
    const btn = e.target.closest('.day-toggle');
    if (btn) btn.classList.toggle('active');
  });

  // Urgency toggle clicks
  document.getElementById('urgency-toggles').addEventListener('click', function(e) {
    const btn = e.target.closest('.urgency-btn');
    if (btn) setActiveUrgency(btn.dataset.urgency);
  });

  // Type toggle clicks
  document.getElementById('type-toggles').addEventListener('click', function(e) {
    var btn = e.target.closest('.type-btn');
    if (btn) setActiveType(btn.dataset.type);
  });

  // --- Export / Import ---
  document.getElementById('btn-export').addEventListener('click', function() {
    var data = {
      version: CURRENT_VERSION,
      exportedAt: new Date().toISOString(),
      tasks: tasks
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'nextaction-backup-' + getTodayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('btn-import').addEventListener('click', function() {
    document.getElementById('import-file').click();
  });

  document.getElementById('import-file').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        var imported = Array.isArray(data.tasks) ? data.tasks : (Array.isArray(data) ? data : null);
        if (!imported) { alert('Invalid backup file.'); return; }
        var fromVersion = data.version || 1;
        if (fromVersion < CURRENT_VERSION) {
          runMigrations(imported, fromVersion);
        }
        if (!confirm('Replace all current tasks with ' + imported.length + ' tasks from backup?')) return;
        tasks = imported;
        saveTasks();
        render();
      } catch (err) {
        alert('Could not read backup file: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // --- Midnight Checker ---
  function startMidnightChecker() {
    setInterval(function() {
      const now = getTodayStr();
      if (now !== lastDateStr) {
        render();
      }
    }, 60000);
  }

  // --- Init ---
  function init() {
    loadTasks();
    render();
    startMidnightChecker();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
