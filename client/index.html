<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0a1410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<title>Command Center</title>
</head>
<body>

<header>
  <h1>Command Center</h1>
  <div class="date" id="today-date"></div>
  <div class="header-row">
    <span class="sync-dot offline" id="sync-indicator" title="Sync status"></span>
    <button class="backup-btn" id="btn-force-sync" title="Force Sync">&#x21BB;</button>
    <button class="backup-btn" id="btn-export" title="Export Backup">&#x2B07;</button>
    <button class="backup-btn" id="btn-import" title="Import Backup">&#x2B06;</button>
    <input type="file" id="import-file" accept=".json" class="hidden">
  </div>
</header>

<div class="next-action-bar" id="next-action-bar"></div>

<div class="habits-section" id="habits-section"></div>

<main id="app"></main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-content">
    <h2 class="modal-title" id="modal-title">Add Task</h2>
    <form id="task-form">
      <div class="form-group">
        <label for="input-title">Task</label>
        <input type="text" id="input-title" class="form-input" placeholder="What needs to be done?" required autocomplete="off">
      </div>
      <div class="form-group" id="project-group">
        <label>Type</label>
        <div class="type-toggles" id="type-toggles">
          <button type="button" class="type-btn active" data-type="task">Task</button>
          <button type="button" class="type-btn" data-type="project">Project</button>
        </div>
      </div>
      <div class="form-group" id="category-group">
        <label for="input-category">Category</label>
        <select id="input-category" class="form-select">
        </select>
      </div>
      <div class="form-group">
        <label for="input-recurrence">Recurrence</label>
        <select id="input-recurrence" class="form-select">
          <option value="none">One-time</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="custom">Every N days</option>
        </select>
      </div>
      <div class="form-group hidden" id="weekly-group">
        <label>Days</label>
        <div class="day-toggles" id="day-toggles">
          <button type="button" class="day-toggle" data-day="0">Su</button>
          <button type="button" class="day-toggle" data-day="1">Mo</button>
          <button type="button" class="day-toggle" data-day="2">Tu</button>
          <button type="button" class="day-toggle" data-day="3">We</button>
          <button type="button" class="day-toggle" data-day="4">Th</button>
          <button type="button" class="day-toggle" data-day="5">Fr</button>
          <button type="button" class="day-toggle" data-day="6">Sa</button>
        </div>
      </div>
      <div class="form-group hidden" id="custom-group">
        <label for="input-interval">Every how many days?</label>
        <input type="number" id="input-interval" class="form-input" min="2" max="365" value="2">
      </div>
      <div class="form-group">
        <label>Urgency</label>
        <div class="urgency-toggles" id="urgency-toggles">
          <button type="button" class="urgency-btn" data-urgency="low">Low</button>
          <button type="button" class="urgency-btn active" data-urgency="medium">Medium</button>
          <button type="button" class="urgency-btn" data-urgency="high">High</button>
          <button type="button" class="urgency-btn" data-urgency="critical">Critical</button>
        </div>
      </div>
      <div class="form-group">
        <label>Due Date (optional)</label>
        <div class="cal-wrap" id="cal-wrap">
          <div class="cal-display" id="cal-display" tabindex="0">
            <span class="cal-display-text empty" id="cal-display-text">Select a date</span>
            <button type="button" class="cal-clear hidden" id="cal-clear" title="Clear date">&times;</button>
          </div>
          <input type="hidden" id="input-due-date">
          <div class="cal-dropdown" id="cal-dropdown">
            <div class="cal-nav">
              <button type="button" class="cal-nav-btn" id="cal-prev">&#x25C0;</button>
              <span class="cal-month" id="cal-month"></span>
              <button type="button" class="cal-nav-btn" id="cal-next">&#x25B6;</button>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="input-notes">Notes (optional)</label>
        <textarea id="input-notes" class="form-input" rows="3" placeholder="Add notes or links..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
        <button type="button" class="btn btn-danger hidden" id="btn-delete">Delete</button>
        <button type="submit" class="btn btn-primary" id="btn-save">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="cat-modal-overlay">
  <div class="modal-content">
    <h2 class="modal-title" id="cat-modal-title">Add Category</h2>
    <form id="cat-form">
      <div class="form-group">
        <label for="cat-input-name">Name</label>
        <input type="text" id="cat-input-name" class="form-input" placeholder="Category name" required autocomplete="off">
      </div>
      <div class="form-group">
        <label>Icon</label>
        <div class="emoji-picker" id="emoji-picker"></div>
        <input type="hidden" id="cat-input-icon">
      </div>
      <div class="form-group">
        <label>Color</label>
        <div class="color-swatches" id="color-swatches"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cat-btn-cancel">Cancel</button>
        <button type="button" class="btn btn-danger hidden" id="cat-btn-delete">Delete</button>
        <button type="submit" class="btn btn-primary" id="cat-btn-save">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="habit-modal-overlay">
  <div class="modal-content">
    <h2 class="modal-title" id="habit-modal-title">Add Habit</h2>
    <form id="habit-form">
      <div class="form-group">
        <label for="habit-input-title">Habit</label>
        <input type="text" id="habit-input-title" class="form-input" placeholder="e.g. High calorie/protein diet" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="habit-input-category">Category</label>
        <select id="habit-input-category" class="form-input form-select"></select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="habit-btn-cancel">Cancel</button>
        <button type="button" class="btn btn-danger hidden" id="habit-btn-delete">Delete</button>
        <button type="submit" class="btn btn-primary" id="habit-btn-save">Save</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
